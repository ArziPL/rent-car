services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rentcar
      POSTGRES_USER: rentcar
      POSTGRES_PASSWORD: rentcar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentcar -d rentcar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./rent-car-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rentcar
      SPRING_DATASOURCE_USERNAME: rentcar
      SPRING_DATASOURCE_PASSWORD: rentcar
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: