services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rentcar
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d rentcar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./rent-car-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rentcar
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Frontend origin as seen by the browser — default keeps http://localhost:3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./rent-car-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Inside Docker the backend is reachable via its service name, not localhost.
      # This is consumed by the Next.js API proxy routes (server-side only).
      BACKEND_URL: http://backend:8080
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
