spring.application.name=rent-car-backend

# DataSource — credentials must be provided via environment variables
spring.datasource.url=jdbc:postgresql://localhost:5432/rentcar
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# JWT — secret MUST be provided via environment variable; no default
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS — comma-separated list of allowed frontend origins
# Override via CORS_ALLOWED_ORIGINS env var in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
